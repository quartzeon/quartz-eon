<html lang="en">
<head>

<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F5F3">
<meta name="robots" content="noindex">
<title>Page not found | Quartz Eon</title>
<!-- GitHub Pages shows this page for any wrong address, at any depth, so all links start from the site folder. -->
<base href="/quartz-eon/">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>
  try {
    var savedTheme = localStorage.getItem('quartz-eon.theme');
    if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.setAttribute('data-theme', savedTheme);
  } catch (e) {}
</script>
</head>
<body>

<header class="site-header">
  <div class="wrap site-header__row">
    <a class="brand" href="index.html" aria-label="Quartz Eon, home">
      <img class="brand__mark" src="assets/logo.png" alt="" width="34" height="34">
      <span class="brand__word">Quartz Eon</span>
    </a>
  </div>
</header>

<main class="wrap legal notfound">
  <p class="notfound__code">404</p>
  <h1>This page does not exist</h1>
  <p class="legal__intro">The link may be old or mistyped. The product or store you were looking for might have moved.</p>
  <div class="notfound__actions">
    <a class="btn btn--ink" href="index.html">Go to the shop</a>
    <a class="btn btn--ghost" href="faq.html">Read the FAQ</a>
  </div>
</main>

<footer class="footer footer--slim">
  <div class="wrap footer__base">
    <p>&copy; Quartz Eon</p>
    <nav class="footer__links" aria-label="More">
      <a href="about.html">About</a>
      <a href="faq.html">FAQ</a>
      <a href="terms.html">Terms of Service</a>
      <a href="privacy.html">Privacy Policy</a>

    </nav>
  </div>
</footer>

</body>
</html>
